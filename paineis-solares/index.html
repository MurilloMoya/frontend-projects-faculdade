<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercício</title>

    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>

<body>
    <div class="container my-5">
        <h4 class="display-5 p-4 bg-primary text-light">
            Paineis Solares
        </h4>

        <h2 class="mt-4">Dados para o cálculo</h2>
        <form id="dados">
            <div class="row mb-3">

                <div class="col-md-6 my-3">
                    <label for="consumo" class="form-label">Consumo Mensal</label>
                    <input type="text" class="form-control" id="consumo" placeholder="ex: 500" required>
                </div>

                <div class="col-md-6  my-3">
                    <label for="potenciaPainel" class="form-label">Potência dos Painéis</label>
                    <input type="text" class="form-control" id="potenciaPainel" placeholder="ex: 0.4" required>
                </div>

                <div class="col-md-6  my-3">
                    <label for="irradiacaoSolar" class="form-label">Irradiação Solar</label>
                    <input type="text" class="form-control" id="irradiacaoSolar" placeholder="ex: 4" required>
                </div>

                <div class="col-md-6  my-3">
                    <label for="eficienciaSistema" class="form-label">Eficiência do Sistema</label>
                    <input type="text" class="form-control" id="eficienciaSistema" placeholder="ex: 0.8" required>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn btn-primary">Gerar Tabela </button>
            </div>
        </form>

        <div class="my-4">
            <h2>Cotações realizadas</h2>
            <table class="table table-hover text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Consumo Mensal</th>
                        <th>Potência Painéis</th>
                        <th>Irradiação Solar</th>
                        <th>Eficiência Sistema</th>
                        <th>Número Painéis Necessários</th>
                    </tr>
                </thead>
                <tbody id="paineis"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./js/montarFront.js"></script>
</body>

</html>
